; HOI4 sound_ogg_hook，放在 DLL 旁边；修改后重启游戏。
; 预解码 PCM 缓存上限（MiB），0 禁用缓存。
cache_mb = 256
; 0 自动选择 1–4 个线程；可手动指定 1–64。
threads = 0
; 1 后台扫描 sound/*.asset 引用的 Ogg 音效，0 全部按需解码。
prefetch = 1
; 超过该大小（MiB）的压缩文件不预取，仍可按需解码。
prefetch_max_file_mb = 24
; 1 枚举 HOI4 工坊（394360）；0 不直接枚举，但仍扫描游戏、DLC、用户目录和 .mod 指定路径。
scan_roots = 1
; 1 输出逐文件解码日志，0 减少日志。
verbose = 1
; 应急解析选项：默认使用字符串锚点，失败后自动使用特征扫描。
force_scan = 0
; 应急手动指定 SDL dynapi 桩 RVA；0 自动定位，仍须通过 WAV 实现校验。
loadwav_stub_rva = 0
